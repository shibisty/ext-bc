<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <!--
    Without this, Firefox for Android lays the document out in a virtual 980px
    viewport and then scales the whole thing down to the screen: the list came
    out as unreadably small desktop UI. A desktop popup has a real viewport of
    its own, so the tag changes nothing there.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bookmark Status Checker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="title">
      <span class="dot"></span>
      <h1 data-i18n="popupTitle">Bookmarks</h1>
    </div>
    <div class="actions">
      <button id="settingsBtn" class="icon-btn" data-i18n-title="settingsBtnTitle" title="Settings">⚙</button>
      <button id="sidePanelBtn" class="icon-btn" data-i18n-title="sidePanelBtnTitle" title="Open in side panel">▤</button>
      <button id="collapseAllBtn" class="icon-btn" data-i18n-title="collapseAllTitle" title="Collapse/expand all">⤢</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button id="tabBookmarksBtn" class="tab active" type="button" role="tab" aria-selected="true" data-i18n="tabBookmarks">Bookmarks</button>
    <button id="tabArchiveBtn" class="tab" type="button" role="tab" aria-selected="false">
      <span data-i18n="tabArchive">Archive</span>
      <span id="archiveCount" class="tab-count" hidden></span>
    </button>
  </nav>

  <div class="searchbar" id="searchbarWrap">
    <div class="searchbar-field">
      <input id="searchInput" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="searchPlaceholder" placeholder="Search by title, address or code (200, 404…)" />
      <button id="searchClearBtn" class="search-clear" type="button" data-i18n-title="searchClearTitle" title="Clear search" hidden>×</button>
    </div>
  </div>

  <div id="permissionBanner" class="permission-banner" hidden>
    <span data-i18n="hostAccessMissing">Site access is off, so most checks fail.</span>
    <button id="grantAccessBtn" type="button" data-i18n="hostAccessGrant">Grant access</button>
  </div>

  <main id="list" class="list" tabindex="-1">
    <div class="empty" id="emptyState" data-i18n="loading">Loading…</div>
  </main>

  <section id="settingsView" class="settings-view" hidden>
    <h2 class="settings-title" data-i18n="settingsTitle">Settings</h2>

    <div class="settings-row">
      <label data-i18n="settingLanguage">Language</label>
      <select id="languageSelect">
        <option value="auto" data-i18n="settingAuto">Auto (browser)</option>
        <option value="ar">العربية</option>
        <option value="am">አማርኛ</option>
        <option value="bg">Български</option>
        <option value="bn">বাংলা</option>
        <option value="ca">Català</option>
        <option value="cs">Čeština</option>
        <option value="da">Dansk</option>
        <option value="de">Deutsch</option>
        <option value="el">Ελληνικά</option>
        <option value="en">English</option>
        <option value="en_GB">English (UK)</option>
        <option value="en_US">English (US)</option>
        <option value="es">Español</option>
        <option value="es_419">Español (Latinoamérica)</option>
        <option value="et">Eesti</option>
        <option value="fa">فارسی</option>
        <option value="fi">Suomi</option>
        <option value="fil">Filipino</option>
        <option value="fr">Français</option>
        <option value="gu">ગુજરાતી</option>
        <option value="he">עברית</option>
        <option value="hi">हिन्दी</option>
        <option value="hr">Hrvatski</option>
        <option value="hu">Magyar</option>
        <option value="id">Indonesia</option>
        <option value="it">Italiano</option>
        <option value="ja">日本語</option>
        <option value="kn">ಕನ್ನಡ</option>
        <option value="ko">한국어</option>
        <option value="lt">Lietuvių</option>
        <option value="lv">Latviešu</option>
        <option value="ml">മലയാളം</option>
        <option value="mr">मराठी</option>
        <option value="ms">Bahasa Melayu</option>
        <option value="nl">Nederlands</option>
        <option value="no">Norsk</option>
        <option value="pl">Polski</option>
        <option value="pt_BR">Português (Brasil)</option>
        <option value="pt_PT">Português (Portugal)</option>
        <option value="ro">Română</option>
        <option value="ru">Русский</option>
        <option value="sk">Slovenčina</option>
        <option value="sl">Slovenščina</option>
        <option value="sr">Српски</option>
        <option value="sv">Svenska</option>
        <option value="sw">Kiswahili</option>
        <option value="ta">தமிழ்</option>
        <option value="te">తెలుగు</option>
        <option value="th">ไทย</option>
        <option value="tr">Türkçe</option>
        <option value="uk">Українська</option>
        <option value="vi">Tiếng Việt</option>
        <option value="zh_CN">中文 (简体)</option>
        <option value="zh_TW">中文 (繁體)</option>
      </select>
    </div>

    <div class="settings-row">
      <label data-i18n="settingTheme">Theme</label>
      <select id="themeSelect">
        <option value="dark" data-i18n="settingThemeDark">Dark</option>
        <option value="light" data-i18n="settingThemeLight">Light</option>
      </select>
    </div>

    <div class="settings-row">
      <label data-i18n="settingInterval">Check every</label>
      <select id="intervalSelect">
        <option value="0" data-i18n="intervalOff">Off — don't auto-check</option>
        <option value="1" data-i18n="interval1">1 minute</option>
        <option value="15" data-i18n="interval15">15 min</option>
        <option value="30" data-i18n="interval30">30 min</option>
        <option value="60" data-i18n="interval60" selected>1 hour</option>
        <option value="180" data-i18n="interval180">3 hours</option>
        <option value="360" data-i18n="interval360">6 hours</option>
        <option value="1440" data-i18n="interval1440">24 hours</option>
      </select>
    </div>

    <div class="settings-row">
      <label data-i18n="settingCredentials">Check as</label>
      <select id="credentialsSelect">
        <option value="omit" data-i18n="credentialsOmit">A signed-out visitor</option>
        <option value="include" data-i18n="credentialsInclude">Signed-in (sends cookies)</option>
      </select>
    </div>

    <div class="settings-row">
      <label data-i18n="settingOpenTrigger">Open a bookmark</label>
      <select id="openTriggerSelect">
        <option value="dblclick" data-i18n="openTriggerDouble">On double click</option>
        <option value="click" data-i18n="openTriggerSingle">On single click</option>
      </select>
    </div>

    <div class="settings-row">
      <label data-i18n="settingOpenTarget">Open in</label>
      <select id="openTargetSelect">
        <option value="new" data-i18n="openTargetNew">A new tab</option>
        <option value="current" data-i18n="openTargetCurrent">The current tab</option>
      </select>
    </div>

    <div class="settings-row">
      <label data-i18n="settingAfterOpen">After opening</label>
      <select id="afterOpenSelect">
        <option value="keep" data-i18n="afterOpenKeep">Keep the popup open</option>
        <option value="close" data-i18n="afterOpenClose">Close the popup</option>
      </select>
    </div>

    <div class="settings-row">
      <label data-i18n="settingRowDetail">Each row shows</label>
      <select id="rowDetailSelect">
        <option value="full" data-i18n="rowDetailFull">Everything</option>
        <option value="title" data-i18n="rowDetailTitle">Title only</option>
      </select>
    </div>

    <div class="settings-row">
      <label data-i18n="settingTitleLines">Title</label>
      <select id="titleLinesSelect">
        <option value="one" data-i18n="titleLinesOne">One line</option>
        <option value="two" data-i18n="titleLinesTwo">Two lines</option>
      </select>
    </div>

    <div class="settings-row">
      <label data-i18n="settingPinToToolbar">Pinning also</label>
      <select id="pinToToolbarSelect">
        <option value="off" data-i18n="pinToToolbarOff">Only pins here</option>
        <option value="on" data-i18n="pinToToolbarOn">Copies to the toolbar</option>
      </select>
    </div>

    <div class="settings-row desktop-only">
      <label data-i18n="settingPopupHeight">Popup height</label>
      <input id="popupHeightInput" type="number" min="200" step="10" inputmode="numeric" />
    </div>

    <div class="settings-row">
      <label data-i18n="settingRowActions">Row actions</label>
      <select id="rowActionsSelect">
        <option value="buttons" data-i18n="rowActionsButtons">Buttons and menu</option>
        <option value="menu" data-i18n="rowActionsMenu">Context menu only</option>
      </select>
    </div>

    <button id="openInTabBtn" class="btn-secondary" data-i18n="settingOpenInTab">Open in a tab (full height)</button>
    <button id="refreshNowBtn" class="btn-secondary" data-i18n="settingRefreshNow">Refresh now</button>
    <button id="closeSettingsBtn" class="btn-secondary" data-i18n="settingBack">← Back</button>
    <div id="versionLabel" class="muted" style="text-align:center; font-size:11px; padding-top:4px;">v0.0.0</div>
  </section>

  <footer class="footer">
    <div id="progressLabel" class="muted footer-line">—</div>
  </footer>

  <div id="resizeGrip" class="resize-grip" data-i18n-title="resizeGripTitle" title="Drag to resize · double-click to reset"></div>

  <dialog id="renameDialog" class="rename-dialog">
    <h2 id="renameTitleLabel" class="rename-title" data-i18n="renameTitle">Rename</h2>
    <input id="renameInput" type="text" autocomplete="off" />
    <div class="rename-actions">
      <button id="renameCancelBtn" class="btn-secondary" type="button" data-i18n="renameCancel">Cancel</button>
      <button id="renameSaveBtn" class="btn-primary" type="button" data-i18n="renameSave">Save</button>
    </div>
  </dialog>

  <script src="popup.js"></script>
</body>
</html>
