name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"] # tags are the release workflow's business
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version most contributors run, and the next one, so an upcoming
        # Node does not break the build unnoticed.
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ci, not install: fails outright when package-lock.json disagrees with
      # package.json instead of quietly resolving something else.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  build:
    name: Build both extensions
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      # The manifests are generated, so this is where a bad generator shows up.
      - name: Check both manifests were produced
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = require('./package.json');
            for (const target of ['chrome', 'firefox']) {
              const manifest = JSON.parse(fs.readFileSync(\`dist/\${target}/manifest.json\`, 'utf8'));
              if (manifest.version !== pkg.version) {
                throw new Error(\`\${target}: manifest \${manifest.version} != package \${pkg.version}\`);
              }
              for (const file of ['background.js', 'popup.js', 'popup.html', 'sidepanel.html', 'popup.css']) {
                if (!fs.existsSync(\`dist/\${target}/\${file}\`)) throw new Error(\`\${target}: missing \${file}\`);
              }
              console.log(\`\${target} ok — v\${manifest.version}\`);
            }
          "

      - name: Upload the store archives
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
