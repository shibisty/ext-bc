name: Release

# Tag a commit to cut a release:
#   npm version patch   # bumps package.json and tags v1.5.6
#   git push --follow-tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and attach the archives

jobs:
  release:
    name: Build and publish the archives
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Same gate as CI: a tag must not ship something that does not typecheck.
      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # A tag that disagrees with package.json would publish a version nobody
      # can reproduce from the repository.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi
          echo "v$PKG"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: true # look it over, then publish from the Releases page
